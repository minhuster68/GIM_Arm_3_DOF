lqr_controller:
  ros__parameters:
    control_hz: 100.0
    # Đúng trần MATLAB. Launch chung mặc định override xuống 0.35 khi bring-up.
    tau_scale: 1.0
    autostart: false
    # Đúng setup_lqr.m trong repo matlab-sim.
    max_int_e: [10.0, 20.0, 10.0]
    max_e: [0.05, 0.02, 0.01]
    max_de: [10.0, 10.0, 10.0]
    max_tau: [5.0, 40.0, 5.0]
    tau_penalty_scale: 1.0
    linearization_step: 0.00001
    # Integrator block trong urdf.slx giới hạn ở [-0.5, 0.5].
    integral_limit: 0.5
    gravity_at_measured: false
    recompute_every: 1
    # Gain MATLAB là CARE liên tục và không đạt kiểm tra ZOH của implementation
    # ROS 100 Hz; false cho phép chạy đúng bộ số này trên MuJoCo để đối chiếu.
    require_discrete_stable: false
    use_discrete_lqr: false
    # Tính K trước khi switch sang effort; runtime chỉ tra bảng, không giải
    # Riccati trong callback điều khiển.
    gain_schedule_hz: 20.0
