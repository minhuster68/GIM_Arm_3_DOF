# Experimental ESO; existing LQR and Kalman parameters unchanged.
lqr_controller:
  ros__parameters:
    feedback_model_mode: independent
    abort_on_tracking_error: false
    control_hz: 100.0
    velocity_filter_type: kalman2
    velocity_kalman_measurement_std:
    - 0.03
    - 0.01
    - 0.04
    velocity_kalman_jerk_std:
    - 180.0
    - 60.0
    - 240.0
    velocity_kalman_reset_gap_s: 0.05
    tau_scale: 1.0
    base_ff_alpha: 2.2
    autostart: false
    use_armature: true
    algorithm_hold: true
    start_velocity_limit_rad_s: 0.05
    max_track_error_rad: 0.1
    max_transition_error_rad: 0.1
    state_timeout: 0.25
    joint_margin_rad: 0.05
    joint_state_qos_depth: 1
    command_heartbeat_nm: 1.0e-06
    position_tracking_only: false
    max_int_e:
    - 0.020412414523193152
    - 0.014433756729740642
    - 0.006
    max_e:
    - 0.0125
    - 0.005
    - 0.022360679774997897
    max_de:
    - 1.0
    - 0.7071067811865475
    - 0.8
    max_tau:
    - 8.0
    - 40.0
    - 6.0
    tau_penalty_scale: 1000.0
    integral_limit: 0.05
    gravity_at_measured: false
    linearization_step: 1.0e-05
    require_discrete_stable: true
    use_discrete_lqr: true
    recompute_every: 1
    gain_schedule_mode: trajectory_time
    gain_schedule_hz: 10.0
    max_tau_rate_nm_s:
    - 5.0
    - 20.0
    - 10.0
    independent_design_model: free_torque
    eso_enabled: true
    eso_bandwidth_rad_s:
    - 15.0
    - 15.0
    - 15.0
    eso_compensation_gain:
    - 1.0
    - 1.0
    - 1.0
    eso_compensation_limit_nm:
    - 0.5
    - 2.0
    - 0.3
    eso_compensation_rate_nm_s:
    - 0.5
    - 2.0
    - 0.3
    eso_warmup_s: 1.5
    eso_ramp_s: 2.0
    eso_reset_gap_s: 0.05
    eso_nominal_input_scale:
    - 2.2
    - 1.0
    - 1.0
