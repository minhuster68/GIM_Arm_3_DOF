# Independent LQR gains tuned joint-by-joint with other joints position-held (2026-10-24).
# Whole-arm torque validation currently rejects this set; do not use for circle yet.
lqr_controller:
  ros__parameters:
    feedback_model_mode: independent
    abort_on_tracking_error: false
    control_hz: 100.0
    tau_scale: 1.0
    base_ff_alpha: 2.2
    autostart: false
    use_armature: true
    algorithm_hold: true
    start_velocity_limit_rad_s: 0.05
    max_track_error_rad: 0.1
    max_transition_error_rad: 0.1
    state_timeout: 0.25
    joint_margin_rad: 0.05
    joint_state_qos_depth: 1
    command_heartbeat_nm: 1.0e-06
    position_tracking_only: false
    max_int_e:
    - 0.020412414523193152
    - 0.014433756729740642
    - 0.0036084391824351605
    max_e:
    - 0.0125
    - 0.005
    - 0.022360679774997897
    max_de:
    - 1.0
    - 0.7071067811865475
    - 1.0
    max_tau:
    - 28.621670111997307
    - 40.0
    - 7.155417527999327
    tau_penalty_scale: 8192.0
    integral_limit: 0.05
    gravity_at_measured: false
    linearization_step: 1.0e-05
    require_discrete_stable: true
    use_discrete_lqr: true
    recompute_every: 1
    gain_schedule_mode: trajectory_time
    gain_schedule_hz: 10.0
    max_tau_rate_nm_s:
    - 5.0
    - 20.0
    - 5.0
