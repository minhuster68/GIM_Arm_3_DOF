lqr_controller:
  ros__parameters:
    # Chỉ một khớp nhận torque; hai khớp khác giữ position.
    control_hz: 100.0
    # Cùng trần torque và hiệu chỉnh feedforward base đã dùng khi tune PID.
    tau_scale: 1.0
    base_ff_alpha: 2.0
    autostart: false
    use_armature: true
    algorithm_hold: true
    start_velocity_limit_rad_s: 0.05
    max_track_error_rad: 0.10
    max_transition_error_rad: 0.10
    state_timeout: 0.25
    joint_margin_rad: 0.05
    joint_state_qos_depth: 1
    command_heartbeat_nm: 0.000001
    # Q = diag(1/max_int_e^2, 1/max_e^2, 0).
    # R = diag(tau_penalty_scale/max_tau^2).
    position_tracking_only: true
    max_int_e: [0.2, 0.2, 0.2]
    max_e: [0.1, 0.1, 0.1]
    max_tau: [5.0, 40.0, 5.0]
    tau_penalty_scale: 512.0
    integral_limit: 0.05
    gravity_at_measured: false
    linearization_step: 0.00001
    require_discrete_stable: true
    use_discrete_lqr: true
    recompute_every: 1
    gain_schedule_mode: trajectory_time
    gain_schedule_hz: 10.0
    max_tau_rate_nm_s: [5.0, 20.0, 5.0]
