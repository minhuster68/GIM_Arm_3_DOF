# Experimental ESO; original SMC/Kalman parameters unchanged.
smc_controller:
  ros__parameters:
    smc_variant: super_twisting
    control_hz: 100.0
    velocity_kalman_enabled:
    - true
    - true
    - true
    velocity_kalman_jerk_psd:
    - 1.0
    - 1.0
    - 1.0
    velocity_kalman_measurement_variance:
    - 0.0004
    - 0.0004
    - 0.0004
    velocity_lpf_hz:
    - 0.0
    - 0.0
    - 0.0
    use_sim_time: false
    autostart: false
    use_armature: true
    algorithm_hold: true
    controlled_joint: all
    feedback_offdiag_scale:
    - 0.0
    - 0.0
    - 0.0
    tau_scale: 1.0
    base_ff_alpha: 2.46
    gravity_scale:
    - 1.0
    - 1.0
    - 1.0
    lambda_gain:
    - 48.0
    - 32.0
    - 12.0
    k1:
    - 10.0
    - 12.0
    - 3.5
    k2:
    - 4.0
    - 3.0
    - 4.0
