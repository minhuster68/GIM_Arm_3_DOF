smc_controller:
  ros__parameters:
    # Bộ khởi đầu CHƯA tune; vector theo base/id0, shoulder/id1, elbow/id2.
    control_hz: 100.0
    tau_scale: 1.0
    base_ff_alpha: 2.2
    autostart: false
    use_armature: true
    algorithm_hold: true
    controlled_joint: all
    start_velocity_limit_rad_s: 0.05
    max_track_error_rad: 0.10
    max_transition_error_rad: 0.10
    state_timeout: 0.25
    joint_margin_rad: 0.05
    joint_state_qos_depth: 1
    command_heartbeat_nm: 0.000001
    lambda_gain: [10.0, 10.0, 6.0]
    ks: [10.0, 20.0, 8.0]
    kr: [3.0, 5.0, 1.0]
    phi: [0.2, 0.15, 0.15]
    # Ràng buộc tốc độ thay đổi tau_fb; không phải torque tổng.
    torque_slew_rate: [5.0, 40.0, 5.0]
