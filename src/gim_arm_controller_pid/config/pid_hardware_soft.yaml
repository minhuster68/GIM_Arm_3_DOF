cascade_pid_controller:
  ros__parameters:
    abort_on_tracking_error: false
    control_hz: 100.0
    # Three independent [velocity, acceleration] filters; only the D input changes.
    velocity_filter_type: kalman2  # none to compare without filtering
    velocity_kalman_measurement_std: [0.03, 0.01, 0.04]  # rad/s: base, shoulder, elbow
    velocity_kalman_jerk_std: [180.0, 60.0, 240.0]  # rad/s^3
    velocity_kalman_reset_gap_s: 0.05
    tau_scale: 1.0
    base_ff_alpha: 2.0
    autostart: false
    gravity_scale:
    - 1.0
    - 1.0
    - 1.0
    cascade_hold: true
    position_kp:
    - 30.0
    - 55.0
    - 14.0
    position_ki:
    - 2.5
    - 1.0
    - 0.8
    position_kd:
    - 0.1
    - 4.0
    - 0.3
    position_integral_limit:
    - 0.3
    - 0.3
    - 0.3
    max_transition_error_rad: 0.1
    max_track_error_rad: 0.1
    state_timeout: 0.25
    joint_margin_rad: 0.05
    command_heartbeat_nm: 1.0e-06
