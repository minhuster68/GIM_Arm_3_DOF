cascade_pid_controller:
  ros__parameters:
    control_hz: 100.0
    # Đúng trần MATLAB. Launch chung mặc định override xuống 0.35 khi bring-up.
    tau_scale: 1.0
    autostart: false
    # Clutch ON: bù trọng lực + damping để người dùng kéo tay robot.
    drag_kd: [0.3, 1.0, 0.3]
    # Khi cascade_hold=false, RETURN chuyển sang gravity-hold PID mềm. Gravity
    # feedforward + PID mềm này dập vận tốc và xóa sai số tĩnh quanh HOME.
    hold_kp: [5.0, 12.0, 4.0]
    hold_kd: [1.0, 3.0, 0.8]
    hold_ki: [0.8, 2.0, 0.8]
    hold_i_torque_limit_nm: [0.5, 1.0, 0.5]
    # Một vòng PID vị trí; gain baseline, chưa tune lại từng khớp.
    # Kp [Nm/rad], Ki [Nm/(rad*s)], Kd [Nm/(rad/s)].
    position_kp: [16.92, 33.84, 16.45]
    position_ki: [12.69, 16.92, 9.87]
    position_kd: [0.94, 1.41, 1.175]
    position_integral_limit: [0.3, 0.3, 0.3]
