cascade_pid_controller:
  ros__parameters:
    control_hz: 100.0
    tau_scale: 0.35
    autostart: false
    gravity_scale: [1.0, 1.0, 1.0]
    # Tên parameter cũ: giữ PREP/HOME bằng cùng PID vị trí một vòng.
    cascade_hold: true
    # Một vòng PID vị trí; gain baseline, chưa tune lại từng khớp.
    # Kp [Nm/rad], Ki [Nm/(rad*s)], Kd [Nm/(rad/s)].
    position_kp: [20.0, 24.5, 7.0]
    position_ki: [2.0, 1.5, 4.0]
    position_kd: [0.8, 0.7, 0.7]
    position_integral_limit: [0.3, 0.3, 0.3]
    max_transition_error_rad: 0.10
    max_track_error_rad: 0.10
    state_timeout: 0.25
    joint_margin_rad: 0.05
    command_heartbeat_nm: 0.000001
