cascade_pid_controller:
  ros__parameters:
    # Profile thử nghiệm riêng trên Gazebo; PI vận tốc xuất mô-men tại khớp.
    # Giảm băng thông vòng tốc độ/ vị trí để tránh kích dao động khớp nhẹ.
    control_hz: 2000.0
    tau_scale: 0.50
    autostart: false
    kpp: [18.0, 24.0, 14.0]
    kvp: [0.94, 1.41, 1.175]      # Nm/(rad/s)
    kvi: [0.705, 0.705, 0.705]    # Nm/rad
    velocity_integral_limit: 0.0
    drag_kd: [0.3, 1.0, 0.3]
    hold_kp: [5.0, 12.0, 4.0]
    hold_kd: [1.0, 3.0, 0.8]
    hold_ki: [0.8, 2.0, 0.8]
    hold_i_torque_limit_nm: [0.5, 1.0, 0.5]
