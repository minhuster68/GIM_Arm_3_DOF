# Elbow/id2 and shoulder/id1 retuned on real hardware 2026-10-24, independent feedback.
# Effective elbow: QE=400, QI=4096, QV=0.04, R=0.037636, RD=0.72, slew=6.5.
# Effective shoulder: QE=4000, QI=16000, QV=0.5, R=0.0005880625, RD=0.1, slew=50.
mpc_controller:
  ros__parameters:
    feedback_model_mode: independent
    control_hz: 100.0
    # Separate [velocity, acceleration] filter per joint; raw driver velocity in.
    # Starting noise settings from LQR; validate on MPC before retuning costs.
    velocity_filter_type: kalman2  # none to compare without filtering
    velocity_kalman_measurement_std: [0.03, 0.01, 0.04]  # rad/s: base, shoulder, elbow
    velocity_kalman_jerk_std: [180.0, 60.0, 240.0]  # rad/s^3
    velocity_kalman_reset_gap_s: 0.05
    tau_scale: 1.0
    base_ff_alpha: 2.2
    command_heartbeat_nm: 1.0e-06
    autostart: false
    use_armature: true
    algorithm_hold: true
    start_velocity_limit_rad_s: 0.05
    max_track_error_rad: 0.1
    max_transition_error_rad: 0.1
    abort_on_tracking_error: false
    state_timeout: 0.25
    joint_margin_rad: 0.05
    joint_state_qos_depth: 1
    prediction_horizon: 40
    control_horizon: 10
    q_integral:
    - 4.0
    - 31.622776601683793
    - 16.0
    q_position:
    - 0.8660254037844388
    - 3.1622776601683795
    - 1.0
    q_velocity:
    - 0.044721359549995794
    - 0.07071067811865477
    - 0.020000000000000004
    r_input:
    - 0.0097
    - 0.0097
    - 0.0097
    r_rate:
    - 0.03
    - 0.12649110640673517
    - 0.04242640687119285
    output_scale_integral:
    - 0.25
    - 0.25
    - 0.25
    output_scale_position:
    - 0.05
    - 0.05
    - 0.05
    output_scale_velocity:
    - 0.1
    - 0.1
    - 0.1
    input_scale:
    - 5.0
    - 40.0
    - 5.0
    weight_convention: matlab_squared
    torque_penalty_scale: 10000.0
    feedback_bounds_mode: trajectory_global
    precompute_prediction: true
    torque_slew_rate:
    - 12.0
    - 80.0
    - 15.0
    integral_limit: 0.6
    linearization_step: 1.0e-05
    max_solver_iterations: 100
    qp_solver: active_set
    admm_rho: 0.1
    admm_iterations: 100
    admm_tolerance: 0.0001
