mpc_controller:
  ros__parameters:
    # Approximate per-joint error models + independent QPs; full reference FF.
    feedback_model_mode: independent
    control_hz: 100.0
    tau_scale: 1.0
    base_ff_alpha: 2.2
    command_heartbeat_nm: 1.0e-06
    autostart: false
    use_armature: true
    algorithm_hold: true
    start_velocity_limit_rad_s: 0.05
    max_track_error_rad: 0.1
    max_transition_error_rad: 0.1
    # Tạm bỏ abort theo sai số bám; bật lại bằng true khi kết thúc thử nghiệm.
    abort_on_tracking_error: false
    state_timeout: 0.25
    joint_margin_rad: 0.05
    joint_state_qos_depth: 1
    prediction_horizon: 40
    control_horizon: 10
    q_integral:
    - 4.0
    - 7.905694150420948
    - 4.0
    q_position:
    - 0.8660254037844388
    - 2.23606797749979
    - 1.0
    q_velocity:
    - 0.044721359549995794
    - 0.223606797749979
    - 0.020000000000000004
    r_input:
    - 0.0097
    - 0.0097
    - 0.0097
    r_rate:
    - 0.03
    - 0.0894427190999916
    - 0.03
    output_scale_integral:
    - 0.25
    - 0.25
    - 0.25
    output_scale_position:
    - 0.05
    - 0.05
    - 0.05
    output_scale_velocity:
    - 0.1
    - 0.1
    - 0.1
    input_scale:
    - 5.0
    - 40.0
    - 5.0
    weight_convention: matlab_squared
    torque_penalty_scale: 10000.0
    feedback_bounds_mode: trajectory_global
    precompute_prediction: true
    torque_slew_rate:
    - 12.0
    - 50.0
    - 6.5
    integral_limit: 0.05
    linearization_step: 1.0e-05
    max_solver_iterations: 100
    qp_solver: active_set
    admm_rho: 0.1
    admm_iterations: 100
    admm_tolerance: 0.0001
