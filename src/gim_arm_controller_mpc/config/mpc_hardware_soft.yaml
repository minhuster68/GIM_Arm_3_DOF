mpc_controller:
  ros__parameters:
    # Initial hardware profile; tune on the real arm. CAN read/write is 100 Hz.
    control_hz: 100.0
    tau_scale: 0.35
    autostart: false
    use_armature: true
    algorithm_hold: true
    start_velocity_limit_rad_s: 0.05
    max_track_error_rad: 0.10
    max_transition_error_rad: 0.10
    state_timeout: 0.25
    joint_margin_rad: 0.05
    joint_state_qos_depth: 1
    prediction_horizon: 40
    control_horizon: 10
    q_integral: [2.0, 2.0, 2.0]
    q_position: [0.6271, 1.5677, 0.6271]
    q_velocity: [0.0, 0.0, 0.0]
    r_input: [0.0097, 0.0097, 0.0097]
    r_rate: [0.03, 0.03, 0.03]
    output_scale_integral: [0.25, 0.25, 0.25]
    output_scale_position: [0.05, 0.05, 0.05]
    output_scale_velocity: [0.10, 0.10, 0.10]
    input_scale: [5.0, 40.0, 5.0]
    weight_convention: matlab_squared
    torque_penalty_scale: 10000.0
    feedback_bounds_mode: trajectory_global
    precompute_prediction: true
    torque_slew_rate: [5.0, 20.0, 5.0]
    integral_limit: 0.05
    linearization_step: 0.00001
    max_solver_iterations: 100
    qp_solver: active_set
    admm_rho: 0.1
    admm_iterations: 100
    admm_tolerance: 0.0001
