mpc_controller:
  ros__parameters:
    control_hz: 100.0
    # Đúng trần MATLAB. Launch chung mặc định override xuống 0.35 khi bring-up.
    tau_scale: 1.0
    autostart: false
    # Đúng setup_mpc.m, kể cả ScaleFactor được áp dụng trong factory.py.
    prediction_horizon: 40
    control_horizon: 10
    q_integral: [2.0, 2.0, 2.0]
    q_position: [0.6271, 1.5677, 0.6271]
    q_velocity: [0.02, 0.02, 0.02]
    r_input: [0.0097, 0.0097, 0.0097]
    r_rate: [0.03, 0.03, 0.03]
    output_scale_integral: [0.25, 0.25, 0.25]
    output_scale_position: [0.05, 0.05, 0.05]
    output_scale_velocity: [0.10, 0.10, 0.10]
    input_scale: [5.0, 40.0, 5.0]
    torque_slew_rate: [100.0, 200.0, 100.0]
    # 0 = không kẹp tích phân, đúng Discrete Integrator trong urdf.slx.
    integral_limit: 0.0
    linearization_step: 0.00001
    max_solver_iterations: 30
