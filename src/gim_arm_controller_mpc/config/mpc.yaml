mpc_controller:
  ros__parameters:
    control_hz: 100.0
    # Đúng trần MATLAB; launch chung cũng mặc định tau_scale=1 cho MPC.
    tau_scale: 1.0
    autostart: false
    # Damping mặc định của runner quá cứng ở vòng 100 Hz và kích dao động do
    # trễ lấy mẫu. Kp giữ nguyên; bộ Kd này đã qua bài giữ đứng Gazebo.
    hold_kd: [0.1, 0.3, 0.1]
    # Bộ robust đã validate trong mpc_result_robust_validated.mat; ScaleFactor
    # được áp dụng trong factory.py.
    prediction_horizon: 40
    control_horizon: 10
    q_integral: [2.0, 2.0, 2.0]
    q_position: [0.62709973, 1.56774934, 0.62709973]
    q_velocity: [0.02, 0.02, 0.02]
    r_input: [0.00971045, 0.00971045, 0.00971045]
    r_rate: [0.03, 0.03, 0.03]
    output_scale_integral: [0.25, 0.25, 0.25]
    output_scale_position: [0.05, 0.05, 0.05]
    output_scale_velocity: [0.10, 0.10, 0.10]
    input_scale: [5.0, 40.0, 5.0]
    torque_slew_rate: [50.0, 200.0, 50.0]
    # 0 = không kẹp tích phân, đúng Discrete Integrator trong urdf.slx.
    integral_limit: 0.0
    linearization_step: 0.00001
    max_solver_iterations: 60
    qp_solver: slsqp
