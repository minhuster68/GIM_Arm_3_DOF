controller_manager:
  ros__parameters:
    update_rate: 100  # Hz -- tần số vòng lặp read()/write() của controller_manager

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    gim_arm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # ĐƯỜNG MÔ-MEN DÙNG CHUNG cho cascade PID, LQR, MPC và SMC. Controller
    # chỉ tác động khi được activate và chỉ một node thuật toán được phép phát
    # lên topic commands tại một thời điểm.
    gim_arm_effort_controller:
      type: forward_command_controller/ForwardCommandController

forward_position_controller:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint
    interface_name: position

# JointTrajectoryController -- nội suy quỹ đạo theo thời gian (không như
# forward_position_controller chỉ nhận 1 điểm đích), và expose action
# FollowJointTrajectory mà MoveIt cần để gửi lệnh xuống.
gim_arm_group_controller:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint
    # position + velocity: JTC ghi CẢ vị trí lẫn vận tốc mong muốn xuống
    # hardware. Vận tốc đó không dùng để điều khiển vận tốc -- plugin nhét nó
    # vào trường Vel_FF của Set_Input_Pos để xoá sai số bám thường trực
    # e = q̇/pos_gain của vòng P trong driver (nguồn trễ chính, xem
    # gim6010_can_protocol.hpp). Driver VẪN ở control_mode = 3 (vị trí).
    # Bỏ 'velocity' khỏi danh sách này là quay lại đúng hành vi cũ.
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

# ───────────────────── ĐƯỜNG MÔ-MEN DÙNG CHUNG ─────────────────────
# Cầu nối giữa node thuật toán (PID/LQR/MPC/SMC) và command
# interface `effort` của plugin phần cứng. ros2_control KHÔNG cho một node bên
# ngoài ghi trực tiếp vào command interface -- phải có controller claim nó, và
# forward_command_controller là loại mỏng nhất: đọc topic, ghi thẳng, không
# tính gì.
#
# Đây cũng chính là cơ chế khiến torque controller và JTC loại trừ nhau.
# interface khác nhau, nên đổi qua lại bằng:
#   ros2 control switch_controllers \
#       --deactivate gim_arm_group_controller --activate gim_arm_effort_controller
#
# CẦN CÓ TRƯỚC: bản patch mô-men trong gim_arm_hardware (interface `effort` +
# prepare/perform_command_mode_switch) và <command_interface name="effort"/>
# trong gim_arm.urdf. Thiếu là controller này KHÔNG load được.
gim_arm_effort_controller:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint
    # MÔ-MEN, đơn vị Nm PHÍA KHỚP. Plugin lo quy về phía rotor
    # (CHIA gear_ratio × direction) trước khi đóng gói frame 0x00E.
    interface_name: effort

# ────────────────────── ĐƯỜNG VẬN TỐC (chưa dùng) ──────────────────────
# Plugin có sẵn chế độ VAN TOC (Set_Input_Vel 0x00D). Kích hoạt nó KHÔNG cần
# build lại C++ — chỉ cần một controller claim DUY NHẤT interface 'velocity'
# (có 'position' kèm theo là plugin hiểu thành chế độ vị trí + Vel_FF).
# Bỏ chú thích khối dưới, thêm `velocity_controller` vào danh sách của
# controller_manager ở đầu file, rồi:
#   ros2 control switch_controllers \
#       --deactivate gim_arm_group_controller --activate velocity_controller
#
# velocity_controller:
#   ros__parameters:
#     joints: [base_joint, shoulder_joint, elbow_joint]
#     interface_name: velocity
#
# CẢNH BÁO: chế độ này CHƯA CHẠY TRÊN TAY THẬT. Driver không giữ vị trí — nguồn
# phát chết thì tay quay đều cho tới khi watchdog của plugin (effort_stale_cycles,
# 0.5 s) tụt lệnh về 0. Đặt <param name="max_velocity_joint_rad_s"> trong từng
# <joint> của URDF trước khi chạy; mặc định 1.0 rad/s.
