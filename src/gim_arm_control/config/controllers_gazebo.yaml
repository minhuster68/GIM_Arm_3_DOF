controller_manager:
  ros__parameters:
    # Gazebo integrates at 2 kHz. Keeping ros2_control on the same tick avoids
    # leaving the low-inertia joints uncontrolled between physics steps.
    update_rate: 2000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    gim_arm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gim_arm_effort_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    # Cascade PID gốc là controller liên tục với cực nhanh. Gazebo cần phát
    # state theo đúng physics tick; 50 Hz mặc định làm vòng kín mất ổn định.
    publish_rate: 2000.0

forward_position_controller:
  ros__parameters:
    joints: [base_joint, shoulder_joint, elbow_joint]
    interface_name: position

gim_arm_group_controller:
  ros__parameters:
    joints: [base_joint, shoulder_joint, elbow_joint]
    command_interfaces: [position, velocity]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

gim_arm_effort_controller:
  ros__parameters:
    joints: [base_joint, shoulder_joint, elbow_joint]
    interface_name: effort
